name: Deploy to VPS

# Deployment happens two ways, and the first one alone is sufficient:
#
#  1. The server polls GitHub every 60s (systemd timer reb7y-autodeploy.timer)
#     and deploys new commits on main. No secrets, nothing to maintain. This is
#     what actually guarantees a push reaches production.
#  2. This workflow, which pushes the deploy immediately instead of waiting for
#     the next poll. It is a convenience layer on top of (1): if the deploy key
#     is missing or unusable it says so and stops, rather than failing the
#     commit, because the timer is about to deploy the same commit anyway.
#
# Both call the same flock-protected entrypoint, so they cannot collide.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_HOST: 162.35.184.237
  VPS_USER: deploy

jobs:
  deploy:
    name: Trigger deploy on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check deploy key
        id: check
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::No VPS_SSH_KEY secret set. The server's auto-deploy timer will deploy this commit within a minute."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # tr -d '\r': a key copied on Windows carries CRLF endings, which
          # OpenSSH rejects as malformed.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            rm -f ~/.ssh/deploy_key
            echo "::warning::VPS_SSH_KEY is not a valid OpenSSH private key, so the instant deploy was skipped. This commit still deploys via the server's 60s timer. To fix, replace the secret with the PRIVATE key - the file WITHOUT the .pub extension - including its BEGIN and END lines: cat ~/.ssh/reb7y_deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Pin server host key
        if: steps.check.outputs.skip == 'false'
        run: |
          # Pinned so we are not trusting whatever answers on first connect.
          printf '%s\n' '162.35.184.237 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsXOQA1Z+Mj8h7Oz7P8OyrL0dq1UQKHWRBRqx+mdiYb' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.check.outputs.skip == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" '/srv/reb7y/run-deploy.sh'

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
